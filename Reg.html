<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA ABIS INTEGRAL - RESULTADOS DIRECTOS</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root {
            --bg-color: #060b13;
            --panel-color: #0d1527;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --success-color: #4ade80;
            --osint-color: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 1200px; border-bottom: 2px dashed var(--border-color); padding-bottom: 15px; }
        h1 { margin: 0; font-size: 24px; color: var(--accent-color); }
        .abis-layout { display: flex; gap: 25px; width: 100%; max-width: 1200px; flex-wrap: wrap; justify-content: center; }
        .abis-panel { background-color: var(--panel-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; flex: 1 1 300px; max-width: 380px; display: flex; flex-direction: column; }
        .panel-title { font-size: 14px; font-weight: bold; color: var(--accent-color); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .panel-title.osint { color: var(--osint-color); }
        .visor-marco { position: relative; width: 100%; height: 220px; background-color: #020617; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 15px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .visor-marco img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .btn-core { background-color: var(--accent-color); color: #020617; font-weight: bold; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 13px; text-transform: uppercase; width: 100%; }
        .btn-osint { background-color: #4c1d95; color: #fff; border: 1px solid #7c3aed; margin-top: 10px; }
        
        /* CONTENEDOR DE RESULTADOS INTERNOS EN PANTALLA */
        .resultados-osint-box { margin-top: 15px; background: #020617; border: 1px solid #3b0764; border-radius: 6px; padding: 10px; height: 180px; overflow-y: auto; }
        .target-web-card { display: flex; gap: 10px; background: #0d1527; padding: 8px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid var(--osint-color); font-size: 12px; }
        .target-web-card img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; background: #000; }
    </style>
</head>
<body>

    <header>
        <h1>SISTEMA ABIS LOCAL & RASTREADOR DE FUENTES ABIERTAS</h1>
        <div id="status-bar" style="color:#fbbf24; font-size:13px; margin-top:5px; font-weight:bold;">SISTEMA ONLINE</div>
    </header>

    <div class="abis-layout">
        <div class="abis-panel">
            <div class="panel-title">1. BASE DE DATOS PROPIA</div>
            <div class="visor-marco"><img id="img-registro" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23334155' stroke-width='1'><circle cx='12' cy='8' r='5'/><path d='M3 21v-2a7 7 0 0 1 14 0v2'/></svg>"></div>
            <input type="file" id="file-registro" accept="image/*">
        </div>

        <div class="abis-panel">
            <div class="panel-title">2. ENFOQUE DE MUESTRA</div>
            <div class="visor-marco"><img id="img-cotejo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23334155' stroke-width='1'><circle cx='12' cy='8' r='5'/><path d='M3 21v-2a7 7 0 0 1 14 0v2'/></svg>"></div>
            <input type="file" id="file-cotejo" accept="image/*">
        </div>

        <div class="abis-panel" style="max-width: 420px; flex-grow: 1.5;">
            <div class="panel-title osint">3. COINCIDENCIAS DIRECTAS EN INTERNET</div>
            <button id="btn-buscar-web" class="btn-core btn-osint" disabled>EJECUTAR ESCANEO WEB EN PANTALLA</button>
            
            <div class="resultados-osint-box" id="consola-osint-resultados">
                <div style="color: #475569; text-align: center; padding-top: 70px; font-size: 12px;">MUESTRA NO PROCESADA</div>
            </div>
        </div>
    </div>

    <script>
        const fileCotejo = document.getElementById('file-cotejo');
        const imgCotejo = document.getElementById('img-cotejo');
        const btnBuscarWeb = document.getElementById('btn-buscar-web');
        const consolaOsint = document.getElementById('consola-osint-resultados');
        
        let archivoImagen = null;

        fileCotejo.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            archivoImagen = file;
            const reader = new FileReader();
            reader.onload = (event) => { imgCotejo.src = event.target.result; };
            reader.readAsDataURL(file);
            btnBuscarWeb.disabled = false;
        });

        // PETICIÓN INTERNA AL SERVIDOR
        btnBuscarWeb.addEventListener('click', async () => {
            consolaOsint.innerHTML = `<div style="color:#a855f7; text-align:center; padding-top:70px; font-size:12px;">ESCANEANDO REDES SOCIALES PÚBLICAS...</div>`;
            
            const formData = new FormData();
            formData.append('fotoSospechoso', archivoImagen);

            try {
                // Llama a tu servidor local (Backend)
                const respuesta = await fetch('http://localhost:3000/api/osint', {
                    method: 'POST',
                    body: formData
                });
                const datosEncontrados = await respuesta.json();
                
                consolaOsint.innerHTML = ""; // Limpiar
                
                // Pintar los sospechosos de internet directo en tu HTML
                datosEncontrados.resultados.forEach(perfil => {
                    consolaOsint.innerHTML += `
                        <div class="target-web-card">
                            <img src="${perfil.fotoUrl}">
                            <div>
                                <strong style="color:#fff;">${perfil.fuente.toUpperCase()}</strong> - Coincidencia: ${perfil.porcentaje}%<br>
                                <span style="color:var(--text-muted); font-size:11px;">ID/Usuario: ${perfil.usuario}</span>
                            </div>
                        </div>`;
                });
            } catch (err) {
                consolaOsint.innerHTML = `<div style="color:var(--alert-color); text-align:center; padding-top:70px; font-size:12px;">Error de conexión con el Servidor OSINT.</div>`;
            }
        });
    </script>
</body>
</html>
